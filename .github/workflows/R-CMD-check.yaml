# R CMD check on three operating systems with release R, once on Ubuntu with
# only the hard dependencies installed, and the test suite run from the source
# tree on Ubuntu.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # detfield and arraydesign are not on CRAN; the Remotes field of
          # DESCRIPTION names their GitHub repositories.
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  hard-dependencies-only:
    # Plain R CMD build and check. The action installs the hard dependencies of
    # DESCRIPTION, and sessioninfo and pak, which it adds itself. Of the eight
    # Suggests, chromote, shinytest2 and testthat are not installed; knitr,
    # later, rmarkdown, sass and withr are, because the Imports need them.
    # Without testthat, tests/testthat.R skips the test run. The vignette is
    # not built in this job.
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, hard dependencies only)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # detfield and arraydesign are not on CRAN; the Remotes field of
          # DESCRIPTION names their GitHub repositories.
          dependencies: '"hard"'
      - name: Build and check with the hard dependencies only
        shell: bash
        run: |
          R CMD build --no-build-vignettes --no-manual .
          R CMD check --no-manual --ignore-vignettes arraydesignR_*.tar.gz
          grep '^Status:' arraydesignR.Rcheck/00check.log
          ! grep -Eq '^Status:.*(ERROR|WARNING)' arraydesignR.Rcheck/00check.log

  test-local:
    # testthat::test_local() runs the tests from the source tree. Tests that
    # read the README or app.R beside the package skip under R CMD check, which
    # runs them from the installed copy; here they run.
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, tests from the source tree)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Run the tests from the source tree
        shell: Rscript {0}
        run: testthat::test_local(stop_on_failure = TRUE)
