# Coverage is printed and saved as an artifact. The workflow uploads nothing
# to a coverage service, so it needs no token.
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # detfield and arraydesign are not on CRAN; the Remotes field of
          # DESCRIPTION names their GitHub repositories.
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE, function_exclusions = "_ui$")
          print(cov)
          cat(sprintf("coverage: %.1f%%\n", covr::percent_coverage(cov)))
          covr::to_cobertura(cov)
        shell: Rscript {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: cobertura.xml
